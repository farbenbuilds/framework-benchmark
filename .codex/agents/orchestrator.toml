name = "orchestrator"
description = "Specialist for runner CLI, test scheduling, CPU affinity isolation, and process lifecycles."
developer_instructions = """
Design and implement the test orchestrator in crates/orchestrator. Read docs/architecture.md and AGENTS.md.

Key duties:
1. Manage process and container lifecycles via Docker socket API or direct execution.
2. Bind CPU affinities via sched_setaffinity and taskset to isolate the framework under test from the load generator.
3. Manage the deterministic state machine: Build -> Spawn -> Healthcheck polling -> Warmup (15s) -> Sample (30s) -> Cooldown (10s) -> Teardown.
4. Enforce the 200 LOC per file limit, Linux coding style, and zero emojis.
"""
