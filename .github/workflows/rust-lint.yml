name: Lint Rust Frameworks

on:
  push:
    branches: [main]
    paths: [frameworks/web-server/rust/**, .github/workflows/rust-lint.yml]
  pull_request:
    paths: [frameworks/web-server/rust/**, .github/workflows/rust-lint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Rust format and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: lint-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Check formatting and clippy
        shell: bash
        run: |
          find frameworks/web-server/rust -name Cargo.toml -print0 |
            xargs -0 -n1 sh -c 'cargo fmt --manifest-path "$0" -- --check && cargo clippy --manifest-path "$0" --all-targets -- -D warnings'
