name: Benchmark Runner

on:
  workflow_dispatch:
    inputs:
      framework_filter:
        description: 'Optional framework name to benchmark'
        required: false
        default: 'all'
  schedule:
    # Run nightly at 00:00 UTC
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Benchmark Suite
    runs-on: [self-hosted, linux, x64, benchmark-dedicated]
    env:
      BENCHMARK_FRAMEWORK_FILTER: ${{ inputs.framework_filter || 'all' }}
      BENCHMARK_DEDICATED_HOST: '1'
      BENCHMARK_TARGET_CPUS: '2-7'
      BENCHMARK_LOAD_CPUS: '8-15'
      BENCHMARK_CGROUP_PARENT: framework-benchmark
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-benchmark-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-benchmark-

      - name: Verify host environment
        run: sh scripts/verify_host.sh --require-dedicated

      - name: Build benchmark orchestrator
        run: cargo build --release --bin orchestrator

      - name: Run orchestrator
        run: taskset --cpu-list "$BENCHMARK_LOAD_CPUS" ./target/release/orchestrator frameworks results

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/
          retention-days: 30
