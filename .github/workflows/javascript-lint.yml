name: Lint JavaScript Frameworks

on:
  push:
    branches: [main]
    paths: [frameworks/web-server/javascript/**, .github/workflows/javascript-lint.yml]
  pull_request:
    paths: [frameworks/web-server/javascript/**, .github/workflows/javascript-lint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: JavaScript format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: lint-javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Check formatting
        run: bunx --bun prettier@3.9.10 --check 'frameworks/web-server/javascript/**/*.{js,ts}'
