name: Lint Ruby Frameworks

on:
  push:
    branches: [main]
    paths: [frameworks/web-server/ruby/**, .github/workflows/ruby-lint.yml]
  pull_request:
    paths: [frameworks/web-server/ruby/**, .github/workflows/ruby-lint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruby syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: lint-ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: '3.4.11'
      - name: Check syntax
        run: find frameworks/web-server/ruby -name '*.rb' -print0 | xargs -0 -n1 ruby -c
