name: Lint PHP Frameworks

on:
  push:
    branches: [main]
    paths: [frameworks/web-server/php/**, .github/workflows/php-lint.yml]
  pull_request:
    paths: [frameworks/web-server/php/**, .github/workflows/php-lint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: lint-php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Check syntax
        run: find frameworks/web-server/php -name '*.php' -print0 | xargs -0 -n1 php -l
