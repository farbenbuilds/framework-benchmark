name: Lint C# Frameworks

on:
  push:
    branches: [main]
    paths: [frameworks/web-server/csharp/**, .github/workflows/csharp-lint.yml]
  pull_request:
    paths: [frameworks/web-server/csharp/**, .github/workflows/csharp-lint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: C# format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: lint-csharp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Check formatting
        shell: bash
        run: |
          find frameworks/web-server/csharp -name '*.csproj' -print0 |
            xargs -0 -n1 dotnet format --verify-no-changes
