name: Lint Rust Workspace

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - frameworks/**
      - scripts/**
      - templates/**
      - .github/workflows/lint.yml
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - frameworks/**
      - scripts/**
      - templates/**
      - .github/workflows/lint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Rust Codebase
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90.0"
          components: "clippy, rustfmt"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Ensure ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi

      - name: Check repository conventions
        run: sh scripts/check_conventions.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --workspace
