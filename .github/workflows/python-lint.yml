name: Lint Python Frameworks

on:
  push:
    branches: [main]
    paths: [frameworks/web-server/python/**, .github/workflows/python-lint.yml]
  pull_request:
    paths: [frameworks/web-server/python/**, .github/workflows/python-lint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Python ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: lint-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install ruff
        run: python -m pip install ruff==0.17.1
      - name: Check lint and format
        run: ruff check frameworks/web-server/python && ruff format --check frameworks/web-server/python
