name: Lint Zig Frameworks

on:
  push:
    branches: [main]
    paths: [frameworks/web-server/zig/**, .github/workflows/zig-lint.yml]
  pull_request:
    paths: [frameworks/web-server/zig/**, .github/workflows/zig-lint.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Zig format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: lint-zig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: find frameworks/web-server/zig -name '*.zig' -print0 | xargs -0 zig fmt --check
