[framework]
name = "falcon"
version = "0.57.0"
language = "ruby"
language_version = "3.4"
website = "https://github.com/socketry/falcon"
category = "web-server"
tier = "micro"

[capabilities]
plaintext = true
json = true
db_single = false
db_multi = false
fortunes = false
updates = false
websocket = false
http2 = false
http3 = false

[build]
engine = "docker"

[build.docker]
dockerfile_glibc = "Dockerfile.glibc"
dockerfile_musl = "Dockerfile.musl"

[runtime]
port = 8080
healthcheck_path = "/healthz"
startup_timeout_seconds = 10
