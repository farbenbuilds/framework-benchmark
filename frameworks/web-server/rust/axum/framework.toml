[framework]
name = "axum"
version = "0.8.1"
language = "rust"
language_version = "1.85.0"
website = "https://github.com/tokio-rs/axum"
category = "full-stack"
tier = "tier-1"

[capabilities]
plaintext = true
json = true
db_single = false
db_multi = false
fortunes = false
updates = false
websocket = false
http2 = true
http3 = false

[build]
engine = "docker"

[build.docker]
dockerfile_glibc = "Dockerfile.glibc"
dockerfile_musl = "Dockerfile.musl"

[runtime]
port = 8080
healthcheck_path = "/healthz"
startup_timeout_seconds = 10
shutdown_signal = "SIGTERM"
