[framework]
name = "actix-web"
version = "4.17.0"
language = "rust"
language_version = "1.90"
website = "https://actix.rs/"
category = "web-server"
tier = "micro"

[capabilities]
plaintext = true
json = true
db_single = true
db_multi = true
fortunes = true
updates = true
websocket = false
http2 = false
http3 = false

[build]
engine = "docker"

[build.docker]
dockerfile_glibc = "Dockerfile.glibc"
dockerfile_musl = "Dockerfile.musl"

[runtime]
port = 8080
healthcheck_path = "/healthz"
startup_timeout_seconds = 10
