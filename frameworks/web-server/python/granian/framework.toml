[framework]
name = "granian"
version = "2.8.5"
language = "python"
language_version = "3.13"
website = "https://github.com/emmett-framework/granian"
category = "web-server"
tier = "micro"

[capabilities]
plaintext = true
json = true
db_single = false
db_multi = false
fortunes = false
updates = false
websocket = false
http2 = false
http3 = false

[build]
engine = "docker"

[build.docker]
dockerfile_glibc = "Dockerfile.glibc"
dockerfile_musl = "Dockerfile.musl"

[runtime]
port = 8080
healthcheck_path = "/healthz"
startup_timeout_seconds = 10
