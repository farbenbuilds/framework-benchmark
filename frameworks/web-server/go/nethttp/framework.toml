[framework]
name = "nethttp"
version = "1.24.0"
language = "go"
language_version = "1.24.0"
website = "https://pkg.go.dev/net/http"
category = "micro"
tier = "tier-1"

[capabilities]
plaintext = true
json = true
db_single = false
db_multi = false
fortunes = false
updates = false
websocket = false
http2 = true
http3 = false

[build]
engine = "docker"

[build.docker]
dockerfile_glibc = "Dockerfile.glibc"
dockerfile_musl = "Dockerfile.musl"

[runtime]
port = 8080
healthcheck_path = "/healthz"
startup_timeout_seconds = 10
shutdown_signal = "SIGTERM"
