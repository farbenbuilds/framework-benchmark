[framework]
name = "frankenphp"
version = "1.13.1"
language = "php"
language_version = "8.5"
website = "https://frankenphp.dev/"
category = "web-server"
tier = "micro"

[capabilities]
plaintext = true
json = true
db_single = false
db_multi = false
fortunes = false
updates = false
websocket = false
http2 = false
http3 = false

[build]
engine = "docker"

[build.docker]
dockerfile_glibc = "Dockerfile.glibc"
dockerfile_musl = "Dockerfile.musl"

[runtime]
port = 8080
healthcheck_path = "/healthz"
startup_timeout_seconds = 10
